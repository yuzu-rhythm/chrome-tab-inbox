<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>まだやっていない</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="app-heading">
        <span class="orange-dot" aria-hidden="true"></span>
        <h1>まだやっていない</h1>
      </header>

      <section class="count-card" aria-live="polite">
        <strong id="unfinished-count">—</strong>
        <span>未処理</span>
      </section>

      <section class="tmp-flow" aria-labelledby="tmp-flow-heading">
        <div class="flow-heading">
          <h2 id="tmp-flow-heading">Temporary Inbox</h2>
          <span id="tmp-enabled-state">確認中…</span>
        </div>
        <div class="flow-route">
          <div class="flow-node">
            <span class="flow-label">TMP</span>
            <strong id="tmp-count">—</strong>
            <small>一時タブ</small>
          </div>
          <span class="flow-arrow" aria-hidden="true">→</span>
          <div class="flow-node flow-target">
            <span class="flow-label">PRESET</span>
            <strong id="preset-flow-target">設定から追加</strong>
            <small>次に整理</small>
          </div>
        </div>
      </section>

      <div class="actions">
        <button id="open-unfinished" type="button" class="primary-button">未処理ウィンドウを開く</button>
        <button id="add-current-tab" type="button" class="secondary-button">未処理へ送る</button>
        <div class="group-actions" aria-label="自由なグループ操作">
          <button id="choose-group" type="button" class="quiet-button">グループを選んで送る</button>
          <button id="open-group" type="button" class="quiet-button">グループを選んで開く</button>
        </div>
      </div>

      <p class="shortcut-guide">
        未処理: <kbd id="popup-shortcut-open-unfinished">…</kbd> で開く・<kbd id="popup-shortcut-add-unfinished">…</kbd> で送る<br>
        自由選択: <kbd id="popup-shortcut-open-group">…</kbd> で開く・<kbd id="popup-shortcut-choose-group">…</kbd> で送る
      </p>

      <section class="mobile-inbox" aria-labelledby="mobile-inbox-heading">
        <h2 id="mobile-inbox-heading">Mobile Inbox</h2>
        <dl>
          <div>
            <dt>Reading List</dt>
            <dd id="reading-list-status">確認中…</dd>
          </div>
          <div>
            <dt>最終同期</dt>
            <dd id="last-sync">まだ同期していません</dd>
          </div>
        </dl>
      </section>

      <p id="popup-status" class="status" role="status" aria-live="polite"></p>
      <a class="options-link" href="../options/options.html" target="_blank" rel="noopener">設定を開く</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
