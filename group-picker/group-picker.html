<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>グループOverview — まだやっていない</title>
    <link rel="stylesheet" href="group-picker.css">
  </head>
  <body>
    <main class="picker-shell">
      <header class="picker-header">
        <div class="title-lockup">
          <span class="app-mark" aria-hidden="true"></span>
          <div>
            <p id="mode-label" class="eyebrow">グループ一覧</p>
            <h1 id="picker-title">グループOverview</h1>
          </div>
        </div>
        <button id="close-picker" class="close-button" type="button" aria-label="閉じる">Esc</button>
      </header>

      <section id="target-card" class="target-card" hidden>
        <span>このタブを振り分け</span>
        <strong id="target-title">確認中…</strong>
        <small id="target-host"></small>
      </section>

      <label class="search-box" for="group-search">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
          <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
        </svg>
        <input
          id="group-search"
          type="text"
          maxlength="80"
          autocomplete="off"
          spellcheck="false"
          placeholder="グループを検索…"
          aria-label="グループ名を検索または入力"
        >
        <kbd>Enter</kbd>
      </label>

      <section id="color-section" class="color-section" aria-labelledby="color-heading">
        <div class="section-heading">
          <h2 id="color-heading">新しいグループの色</h2>
          <span id="color-name">オレンジ</span>
        </div>
        <div id="color-picker" class="color-picker" role="radiogroup" aria-label="グループの色"></div>
      </section>

      <section class="results-section" aria-labelledby="results-heading">
        <div class="section-heading">
          <h2 id="results-heading">候補</h2>
          <span id="result-count">0件</span>
        </div>
        <div id="group-list" class="group-list" role="listbox" aria-label="グループ候補"></div>
        <p id="empty-state" class="empty-state" hidden></p>
      </section>

      <footer class="picker-footer">
        <p id="picker-status" class="status" role="status" aria-live="polite"></p>
        <p class="key-help"><kbd>↑</kbd><kbd>↓</kbd> 移動　<kbd>Enter</kbd> 決定　<kbd>Ctrl+0</kbd> TMP　<kbd>Ctrl+1–9</kbd> プリセット　<kbd>Option+1–9</kbd> 色　<kbd>Esc</kbd> 閉じる</p>
      </footer>
    </main>
    <script src="group-picker.js"></script>
  </body>
</html>
